events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  upstream bot { server bot:3000; }
  server {
    listen 80;
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
    location /api/ {
      proxy_pass http://bot;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /bot/ {
      proxy_pass http://bot;
      proxy_set_header Host $host;
    }
    location /health {
      proxy_pass http://bot;
    }
  }
}
