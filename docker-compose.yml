# Single-VPS deploy. Bot MUST stay at 1 replica — JSON tryTake is single-process only.
# Prerequisites: cp .env.example .env && pnpm install && pnpm build:web
services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    volumes:
      # Persist orders only — do not mount the whole repository
      - bot-data:/app/data
    environment:
      DATA_DIR: /app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    deploy:
      replicas: 1

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
      # Uncomment when TLS certs exist:
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bot-data:
