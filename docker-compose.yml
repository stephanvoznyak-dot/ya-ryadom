services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    volumes:
      - ./apps/bot/data:/app/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - bot
    restart: unless-stopped
