# Optional single-VPS: bot API + static Mini App via nginx
services:
  bot:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ya-ryadom/bot start"
    env_file: .env
    volumes:
      - .:/app
      - bot-data:/app/apps/bot/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  bot-data:
