# Single-VPS deploy. Bot MUST stay at 1 replica — JSON tryTake is single-process only.
services:
  bot:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ya-ryadom/bot start"
    env_file: .env
    volumes:
      - .:/app
      - bot-data:/app/apps/bot/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      replicas: 1

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bot-data:
